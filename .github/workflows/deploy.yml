name: Deploy to angel.xai2100he.cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: angel-one
  REMOTE_DIR: /home/angel.xai2100he.cloud/public_html

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npx vite build

      - name: Find build output
        id: out
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -d dist ]; then echo "dir=dist" >> $GITHUB_OUTPUT
          elif [ -d build ]; then echo "dir=build" >> $GITHUB_OUTPUT
          else echo "No dist/ or build/ folder found" && exit 1; fi

      - name: Add SPA rewrite rules
        working-directory: ${{ env.APP_DIR }}
        run: |
          printf '%s\n' \
            'RewriteEngine On' \
            'RewriteCond %{REQUEST_FILENAME} !-f' \
            'RewriteCond %{REQUEST_FILENAME} !-d' \
            'RewriteRule ^ /index.html [L]' \
            > ${{ steps.out.outputs.dir }}/.htaccess

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload to server
        run: |
          rsync -avz --delete \
            ${{ env.APP_DIR }}/${{ steps.out.outputs.dir }}/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.REMOTE_DIR }}/

      - name: Fix ownership
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'U=$(stat -c "%U:%G" /home/angel.xai2100he.cloud) && chown -R "$U" /home/angel.xai2100he.cloud/public_html'
